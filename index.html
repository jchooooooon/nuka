<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5dbe7"><meta name="color-scheme" content="light"><title>누카의 부엌 · 작은 발효 공방</title><meta name="description" content="레트로 애니메이션 속 작은 주방에서 누카를 만들어요. 배합부터 향미, 32가지 재료의 절임 시간과 맛의 변화까지."><meta property="og:title" content="누카의 부엌 · 작은 발효 공방"><meta property="og:description" content="쌀겨를 섞고, 취향을 담고, 32가지 재료의 맛을 상상해요."><link rel="stylesheet" href="style.css?v=29"><link rel="stylesheet" href="game-chrome.css?v=29"><script defer src="data.js?v=29"></script><script defer src="model.js?v=29"></script><script defer src="stage.js?v=29"></script><script defer src="sheet-fit.js?v=29"></script><script defer src="app.js?v=29"></script></head>
<body>
<main id="app">
 <header class="app-header"><button id="home" class="icon-button" aria-label="첫 화면">⌂</button><div class="brand">누카의 부엌<small>NUKA ATELIER</small></div><button id="menu" class="icon-button" aria-label="메뉴">⋯</button></header>
 <section class="scene" id="scene" aria-label="캐릭터와 함께 만드는 누카">
  <div id="scene-art" class="scene-art" role="img" aria-label="앞치마를 입은 캐릭터의 작은 주방"></div><canvas id="effects" aria-hidden="true"></canvas>
  <div class="chapter"><span id="chapter">작은 발효 공방</span><span id="quantity"></span></div>
  <div id="landing-title" class="landing-title"><span>A LITTLE FERMENTED LIFE</span><h1>천천히 만드는<br>나의 작은 부엌</h1><p>쌀겨 한 줌에서 시작하는 발효 이야기</p></div>
  <div id="gesture-guide" class="gesture-guide" hidden></div>
  <button id="food-piece" class="food-piece" hidden aria-label="재료를 누카에 넣기"><img id="piece-image" alt=""><span id="piece-label"></span></button>
  <div id="taste-note" class="taste-note" hidden></div>
  <div id="scene-toast" class="scene-toast" role="status" hidden></div>
 </section>
 <section class="conversation" aria-live="polite"><div class="speaker"><span class="speaker-name">오늘의 부엌</span><button id="detail" aria-label="현재 단계 자세히 보기">?</button></div><h2 id="line"></h2><p id="subline"></p><div class="progress-track" id="progress-track" hidden><div id="progress-fill"></div></div></section>
 <section class="controls" id="controls"></section>
</main>
<dialog id="sheet"><div class="sheet-header"><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-button" aria-label="닫기">×</button></div><div id="sheet-body"></div></dialog>
<noscript>누카의 부엌은 자바스크립트를 켜야 사용할 수 있습니다.</noscript>
</body></html>
